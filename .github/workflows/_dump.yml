name: AniList-DB-Dump (reusable)

on:
  workflow_call:
    inputs:
      kind:
        description: "weekly or manual"
        required: true
        type: string
    secrets:
      DATABASE_URL:
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: supabase-dump
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: ${{ inputs.kind }}
      PG_VERSION: ${{ vars.PG_VERSION || '18' }}
      DUMP_SCHEMAS: ${{ vars.DUMP_SCHEMAS || 'public' }}
      KEEP_WEEKLY: ${{ vars.KEEP_WEEKLY || '0' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out the repo (for .github/scripts)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Compute tag and dates
        run: |
          set -euo pipefail
          date_tag=$(date -u +%F)
          time_tag=$(date -u +%H%M)
          if [ "$KIND" = "manual" ]; then
            tag="manual-${date_tag}-${time_tag}"
            title="AniList-DB-Dump manual - ${date_tag} ${time_tag} UTC"
          else
            tag="weekly-${date_tag}"
            title="AniList-DB-Dump weekly - ${date_tag}"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="${tag}-$(date -u +%S)"
          fi
          dow=$(date -u +%u)
          add=$(( (6 - dow + 7) % 7 ))
          [ "$add" -eq 0 ] && add=7
          next_date=$(date -u -d "+${add} days" +%F)
          {
            echo "TAG=$tag"
            echo "TITLE=$title"
            echo "CREATED=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "NEXT_WEEKLY=Saturday ${next_date} 00:00 UTC"
            echo "BASENAME=anilist-db-dump-${tag}"
          } >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_VERSION}"
          # The runner ships PostgreSQL 16 and it wins on PATH. Put the version we just installed first.
          echo "/usr/lib/postgresql/${PG_VERSION}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${PG_VERSION}/bin/pg_dump" --version

      - name: Dump database (custom, tar, plain SQL, SQL gzip, schema only)
        run: |
          set -euo pipefail
          args=(--no-owner)
          IFS=',' read -ra schemas <<< "$DUMP_SCHEMAS"
          for s in "${schemas[@]}"; do
            s=$(echo "$s" | xargs)
            [ -n "$s" ] && args+=(--schema="$s")
          done

          # 1. custom format (.dump), the base for pg_restore. --compress=0: no compression.
          pg_dump "$DATABASE_URL" "${args[@]}" --format=custom --compress=0 --file="${BASENAME}.dump"
          # 2. tar format (.tar)
          pg_dump "$DATABASE_URL" "${args[@]}" --format=tar --file="${BASENAME}.tar"
          # 3. plain SQL made once from the .dump, published as is (uncompressed), plus a gzipped copy (.sql.gz)
          pg_restore --no-owner --file="${BASENAME}.sql" "${BASENAME}.dump"
          gzip -9 -c "${BASENAME}.sql" > "${BASENAME}.sql.gz"
          # Rows per table inside the dump (one line per row in COPY blocks), for MANIFEST.json
          awk '/^COPY /{t=$2; n=0; inb=1; next} inb && /^\\\.$/{gsub(/"/,"",t); print t "\t" n; inb=0; next} inb{n++}' \
            "${BASENAME}.sql" > dump-counts.tsv
          # 4. schema-only SQL
          pg_restore --no-owner --schema-only --file="${BASENAME}-schema.sql" "${BASENAME}.dump"

          size=$(stat -c %s "${BASENAME}.dump")
          if [ "$size" -lt 200 ]; then
            echo "Dump looks empty ($size bytes), aborting." >&2
            exit 1
          fi
          echo "SERVER_VERSION=$(psql "$DATABASE_URL" -Atc 'show server_version' 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"

      - name: Export CSV, TSV, JSON Lines and JSON (data only, one plain file per table)
        run: |
          set -euo pipefail
          count=0
          IFS=',' read -ra schemas <<< "$DUMP_SCHEMAS"
          for s in "${schemas[@]}"; do
            s=$(echo "$s" | xargs)
            [ -n "$s" ] || continue
            [[ "$s" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Invalid schema name: $s"; exit 1; }
            mapfile -t tables < <(psql "$DATABASE_URL" -X -Atq \
              -c "select table_name from information_schema.tables where table_schema = '${s}' and table_type = 'BASE TABLE' order by 1")
            for t in "${tables[@]}"; do
              [ -n "$t" ] || continue
              if ! [[ "$t" =~ ^[A-Za-z0-9_]+$ ]]; then
                echo "::warning::Skipping CSV/TSV/JSON export of ${s}.${t} (unsupported characters in table name)"
                continue
              fi
              out="${BASENAME}.${s}.${t}"
              # CSV with a header row. Nested JSON columns become quoted JSON strings.
              psql "$DATABASE_URL" -X -q \
                -c "\\copy (select * from \"${s}\".\"${t}\") to '${out}.csv' with (format csv, header true)"
              # TSV with a header row (CSV quoting rules, tab delimiter).
              psql "$DATABASE_URL" -X -q \
                -c "\\copy (select * from \"${s}\".\"${t}\") to '${out}.tsv' with (format csv, delimiter E'\\t', header true)"
              # JSON Lines: one JSON object per row. Plain psql output (not \copy) so backslashes are not doubled.
              psql "$DATABASE_URL" -X -Atq \
                -c "select row_to_json(x) from \"${s}\".\"${t}\" x" > "${out}.jsonl"
              # JSON: the same rows as one valid JSON array, one object per line (built from the .jsonl, no extra query).
              { echo '['; sed '$!s/$/,/' "${out}.jsonl"; echo ']'; } > "${out}.json"
              count=$((count + 1))
            done
          done
          [ "$count" -gt 0 ] || { echo "::error::No tables found for CSV/TSV/JSON export." >&2; exit 1; }
          echo "Exported ${count} table(s)."

      - name: Export Parquet, SQLite and DuckDB (data only)
        run: |
          set -euo pipefail
          python3 -m venv .export-venv
          .export-venv/bin/pip install --quiet "psycopg[binary]" pyarrow duckdb
          .export-venv/bin/python .github/scripts/export-formats.py

      - name: Build and check MANIFEST (row counts)
        run: |
          set -euo pipefail
          .export-venv/bin/python .github/scripts/build-manifest.py

      - name: List files and checksum
        run: |
          set -euo pipefail
          # Everything is released as plain, uncompressed files, except the SQL which also comes as .sql.gz. No zip archives, no encryption.
          files=("${BASENAME}.dump" "${BASENAME}.tar" "${BASENAME}.sql" "${BASENAME}.sql.gz" "${BASENAME}-schema.sql" "${BASENAME}.sqlite" "${BASENAME}.duckdb")
          # One file per table: CSV, TSV, JSON Lines, JSON, Parquet
          for ext in csv tsv jsonl json parquet; do
            for f in "${BASENAME}".*."${ext}"; do
              [ -e "$f" ] || continue
              # GitHub rejects empty (0 byte) release assets, e.g. the .jsonl of an empty table
              if [ -s "$f" ]; then files+=("$f"); else echo "::notice::Not releasing $f (empty file, the table has no rows)"; fi
            done
          done
          files+=("MANIFEST-${TAG}.json")
          printf '%s\n' "${files[@]}" > assets.txt
          sums="SHA256SUMS-${TAG}.txt"
          xargs sha256sum < assets.txt > "$sums"
          echo "$sums" >> assets.txt
          for f in $(cat assets.txt); do
            [ "$(stat -c %s "$f")" -lt 2147483648 ] || echo "::warning::$f is over the 2 GB release asset limit and will fail to upload"
          done
          echo "Release will have $(wc -l < assets.txt) file(s)."
          [ "$(wc -l < assets.txt)" -le 1000 ] || echo "::warning::More than 1000 files; GitHub allows at most 1000 assets per release"

      - name: Write release notes
        run: |
          set -euo pipefail
          if [ "$KIND" = "manual" ]; then kind_line="Manual dump (does not affect the Saturday schedule)"
          else kind_line="Scheduled weekly dump"; fi

          describe() {
            case "$1" in
              MANIFEST-*.json) echo "row counts per table in every file, with a match check" ;;
              SHA256SUMS-*)    echo "checksums" ;;
              *-schema.sql)    echo "plain SQL, schema only" ;;
              *.dump)          echo "pg_dump custom format, uncompressed (pg_restore)" ;;
              *.tar)           echo "pg_dump tar format (pg_restore)" ;;
              *.sql.gz)        echo "plain SQL, gzipped (psql)" ;;
              *.sql)           echo "plain SQL, uncompressed (psql)" ;;
              *.csv)           echo "CSV with header row (data only)" ;;
              *.tsv)           echo "TSV with header row (data only)" ;;
              *.jsonl)         echo "JSON Lines, one object per line (data only)" ;;
              *.json)          echo "JSON array of row objects (data only)" ;;
              *.parquet)       echo "Parquet, uncompressed, typed (data only)" ;;
              *.sqlite)        echo "SQLite database (data only)" ;;
              *.duckdb)        echo "DuckDB database (data only)" ;;
              *)               echo "" ;;
            esac
          }
          {
            echo "## AniList-DB-Dump"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Type** | ${kind_line} |"
            echo "| **Created** | ${CREATED} |"
            echo "| **Tag** | \`${TAG}\` |"
            echo "| **Next scheduled update** | ${NEXT_WEEKLY} |"
            echo "| **Schemas** | ${DUMP_SCHEMAS} |"
            echo "| **Postgres server** | ${SERVER_VERSION} |"
            echo "| **Compression** | none, except the SQL which is also provided as .sql.gz |"
            echo
            echo "### Files"
            echo
            echo "| File | Format | Size |"
            echo "|---|---|---|"
            while read -r f; do
              echo "| \`$f\` | $(describe "$f") | $(du -h "$f" | cut -f1) |"
            done < assets.txt
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS-${TAG}.txt\`"
            echo
            cat manifest-summary.md
          } > notes.md
          cat >> notes.md <<'NOTES'

          ### Restore

          ```bash
          # custom format
          pg_restore --no-owner -d "$TARGET_DB_URL" FILE.dump
          # tar format
          pg_restore --no-owner -d "$TARGET_DB_URL" FILE.tar
          # plain SQL
          psql "$TARGET_DB_URL" -f FILE.sql
          gunzip -c FILE.sql.gz | psql "$TARGET_DB_URL"
          # CSV, TSV, JSON, JSON Lines, Parquet: one file per table, use them directly.
          # SQLite and DuckDB files open directly.
          ```
          NOTES
          sed -i 's/^          //' notes.md

      - name: Create release
        run: |
          set -euo pipefail
          latest="--latest=false"
          [ "$KIND" = "weekly" ] && latest="--latest"
          mapfile -t assets < assets.txt
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file notes.md "$latest"

      - name: Prune old weekly releases (optional)
        if: ${{ inputs.kind == 'weekly' }}
        run: |
          set -euo pipefail
          [ "$KEEP_WEEKLY" -gt 0 ] || { echo "KEEP_WEEKLY not set, skipping."; exit 0; }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            | jq -r --argjson keep "$KEEP_WEEKLY" \
                '[.[] | select(.tagName | startswith("weekly-"))]
                 | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
