name: AniList-DB-Dump - Manual

# Click "Run workflow" in the Actions tab. Creates a release tagged
# manual-YYYY-MM-DD-HHMM. The Saturday schedule is a separate workflow,
# so running this does NOT reset, move or skip it.
on:
  workflow_dispatch:
    inputs:
      compress:
        description: "Compress release: also publish the SQL as .sql.gz, .sql.zip and .sql.zst. Off (default) publishes one plain .sql"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  dump:
    uses: ./.github/workflows/_dump.yml
    with:
      kind: manual
      compress: ${{ inputs.compress }}
    secrets: inherit
