name: AniList-DB-Dump - Weekly

# Runs every Saturday at 00:00 UTC. Change the cron line to move it.
# Manual dumps live in manual-dump.yml and never touch this schedule.
on:
  schedule:
    - cron: "0 0 * * 6"

permissions:
  contents: write

jobs:
  dump:
    uses: ./.github/workflows/_dump.yml
    with:
      kind: weekly
      # Off unless the repo variable COMPRESS_RELEASE is set to "true"
      compress: ${{ vars.COMPRESS_RELEASE == 'true' }}
    secrets: inherit
