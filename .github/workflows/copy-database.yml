name: AniList-DB-Dump - Copy database (optional)

# Copies a database from one place to another:
#   live    -> pg_dump straight from SOURCE_DB_URL into TARGET_DB_URL
#   release -> restore a dump from one of this repo's releases into TARGET_DB_URL
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where to copy from"
        type: choice
        options:
          - live
          - release
        default: live
      release_tag:
        description: "Release tag to restore (only when source = release)"
        type: string
        required: false
      wipe_target:
        description: "DROP the dumped schemas on the target before restoring"
        type: boolean
        default: false
      confirm:
        description: "Type COPY to confirm. This writes to TARGET_DB_URL!"
        type: string
        required: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: supabase-copy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ inputs.source }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      WIPE: ${{ inputs.wipe_target }}
      CONFIRM: ${{ inputs.confirm }}
      PG_VERSION: ${{ vars.PG_VERSION || '17' }}
      DUMP_SCHEMAS: ${{ vars.DUMP_SCHEMAS || 'public' }}
      SOURCE_DB_URL: ${{ secrets.SOURCE_DB_URL || secrets.DATABASE_URL }}
      TARGET_DB_URL: ${{ secrets.TARGET_DB_URL }}
      DUMP_ENCRYPTION_PASSPHRASE: ${{ secrets.DUMP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "COPY" ] || { echo "Type COPY in the confirm box." >&2; exit 1; }
          [ -n "$TARGET_DB_URL" ] || { echo "Secret TARGET_DB_URL is not set." >&2; exit 1; }
          if [ "$SOURCE" = "release" ] && [ -z "$RELEASE_TAG" ]; then
            echo "Give a release_tag when source = release." >&2; exit 1
          fi
          if [ "$SOURCE" = "live" ] && [ -z "$SOURCE_DB_URL" ]; then
            echo "Set SOURCE_DB_URL (or DATABASE_URL)." >&2; exit 1
          fi
          if [ "$SOURCE_DB_URL" = "$TARGET_DB_URL" ]; then
            echo "Source and target are the same database. Refusing." >&2; exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_VERSION}"
          # The runner ships PostgreSQL 16 and it wins on PATH. Put the version we just installed first.
          echo "/usr/lib/postgresql/${PG_VERSION}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${PG_VERSION}/bin/pg_dump" --version

      - name: Wipe target schemas (optional)
        if: ${{ inputs.wipe_target }}
        run: |
          set -euo pipefail
          IFS=',' read -ra schemas <<< "$DUMP_SCHEMAS"
          for s in "${schemas[@]}"; do
            s=$(echo "$s" | xargs)
            [ -n "$s" ] || continue
            echo "Wiping schema: $s"
            psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA IF EXISTS \"$s\" CASCADE;" \
              -c "CREATE SCHEMA \"$s\";"
          done

      - name: Copy
        run: |
          set -uo pipefail
          if [ "$SOURCE" = "live" ]; then
            args=(--format=plain --no-owner)
            IFS=',' read -ra schemas <<< "$DUMP_SCHEMAS"
            for s in "${schemas[@]}"; do
              s=$(echo "$s" | xargs)
              [ -n "$s" ] && args+=(--schema="$s")
            done
            pg_dump "$SOURCE_DB_URL" "${args[@]}" > restore.sql
          else
            # Releases made with "Compress release" on have .sql.gz; the default has a plain .sql.
            # Try the .gz first, then the plain file (the [0-9] keeps -schema.sql out of the match).
            if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern 'anilist-db-dump-*.sql.gz*' --dir dl 2>/dev/null; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern 'anilist-db-dump-*[0-9].sql' --pattern 'anilist-db-dump-*[0-9].sql.gpg' --dir dl \
                || { echo "No SQL file found in release $RELEASE_TAG." >&2; exit 1; }
            fi
            sqlfile=$(ls dl/* | head -n 1)
            case "$sqlfile" in
              *.gpg)
                [ -n "$DUMP_ENCRYPTION_PASSPHRASE" ] || { echo "Dump is encrypted; set DUMP_ENCRYPTION_PASSPHRASE." >&2; exit 1; }
                if [[ "$sqlfile" == *.sql.gz.gpg ]]; then unpack=(gunzip); else unpack=(cat); fi
                printf '%s' "$DUMP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes \
                  --pinentry-mode loopback --passphrase-fd 0 --decrypt "$sqlfile" | "${unpack[@]}" > restore.sql ;;
              *.sql.gz) gunzip -c "$sqlfile" > restore.sql ;;
              *)        cp "$sqlfile" restore.sql ;;
            esac
          fi

          [ -s restore.sql ] || { echo "Nothing to restore." >&2; exit 1; }

          # Not ON_ERROR_STOP on purpose: Supabase has managed objects/roles
          # that can produce harmless "already exists" noise. Errors are listed below.
          psql "$TARGET_DB_URL" -f restore.sql 2> restore.err > /dev/null
          echo "---- errors reported by psql (review these) ----"
          grep -i "error" restore.err | head -n 50 || echo "none"
